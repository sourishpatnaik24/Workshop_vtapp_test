<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sourish.MC | Games</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=VT323&display=swap');

:root{
  --bg-dark:#060a12;
  --bg-navy:#0d1b2e;
  --panel:#111a29;
  --panel-light:#1b2740;
  --border-hi:#4a5c7a;
  --border-lo:#02040a;
  --grass:#5c8a3a;
  --grass-dark:#3f6528;
  --diamond:#4fd8e8;
  --gold:#ffcc33;
  --text:#dbe4f0;
  --text-dim:#8a97ab;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:'VT323', monospace;
  font-size:20px;
  color:var(--text);
  min-height:100vh;
  background:
    linear-gradient(160deg,var(--bg-dark),var(--bg-navy) 60%,var(--bg-dark)),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 48px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 48px);
  background-attachment:fixed;
  padding-bottom:130px;
}
h1,h2,h3,.pixel-font{ font-family:'Pixelify Sans', sans-serif; }
a{ color:inherit; }
.topbar{ padding:24px 24px 8px; text-align:center; }
.logo{ font-family:'Pixelify Sans'; font-size:20px; color:var(--diamond); letter-spacing:1px; }
.logo span{ color:var(--gold); }
.container{ max-width:820px; margin:0 auto; padding:16px 20px 40px; }

.pixel-panel{
  background:var(--panel);
  border:4px solid var(--border-lo);
  box-shadow:
    inset 3px 3px 0 var(--border-hi),
    inset -3px -3px 0 var(--border-lo),
    0 6px 0 rgba(0,0,0,0.4);
  padding:24px;
}

.hotbar{
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px;
  background:rgba(6,10,18,0.9);
  padding:8px;
  border:4px solid var(--border-lo);
  box-shadow: inset 2px 2px 0 var(--border-hi), inset -2px -2px 0 var(--border-lo);
  z-index:50;
}
.hotbar a{
  position:relative; width:58px; height:58px;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  background:var(--panel-light);
  border:3px solid var(--border-lo);
  box-shadow: inset 2px 2px 0 var(--border-hi), inset -2px -2px 0 var(--border-lo);
  text-decoration:none; font-size:22px; color:var(--text);
}
.hotbar a .slot-num{ position:absolute; top:2px; left:4px; font-family:'Pixelify Sans'; font-size:8px; color:var(--text-dim); }
.hotbar a .slot-label{ font-family:'Pixelify Sans'; font-size:7px; margin-top:2px; }
.hotbar a.active{ border-color:#fff; box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 var(--border-lo); }
.hotbar a:hover{ background:var(--grass-dark); }

h1.page-title{ font-size:24px; color:#fff; text-align:center; margin-bottom:8px; letter-spacing:1px; }
p.page-sub{ text-align:center; color:var(--text-dim); font-size:18px; margin-bottom:24px; }

.item-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px; }
.item-slot{ text-align:center; transition:transform 0.1s; }
.item-slot:hover{ transform:translateY(-4px); border-color:var(--diamond); }
.item-icon{ font-size:38px; display:block; margin-bottom:8px; }
.item-name{ font-family:'Pixelify Sans'; font-size:12px; line-height:1.5; color:var(--diamond); }

@media (max-width:480px){
  .hotbar a{ width:48px; height:48px; font-size:18px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">SOURISH<span>.MC</span></div>
</div>

<div class="container">
  <h1 class="page-title">&#127918; GAME INVENTORY</h1>
  <p class="page-sub">Titles currently equipped</p>

  <div class="item-grid">
    <div class="pixel-panel item-slot">
      <span class="item-icon">&#9935;</span>
      <span class="item-name">MINECRAFT</span>
    </div>
    <div class="pixel-panel item-slot">
      <span class="item-icon">&#9917;</span>
      <span class="item-name">FIFA 22</span>
    </div>
    <div class="pixel-panel item-slot">
      <span class="item-icon">&#128123;</span>
      <span class="item-name">PHASMOPHOBIA</span>
    </div>
    <div class="pixel-panel item-slot">
      <span class="item-icon">&#128203;</span>
      <span class="item-name">FOOTBALL MANAGER 23</span>
    </div>
    <div class="pixel-panel item-slot">
      <span class="item-icon">&#127950;</span>
      <span class="item-name">ASPHALT LEGENDS UNITE</span>
    </div>
  </div>
</div>

<nav class="hotbar">
  <a href="index.html"><span class="slot-num">1</span>&#127968;<span class="slot-label">HOME</span></a>
  <a href="about.html"><span class="slot-num">2</span>&#128100;<span class="slot-label">ABOUT</span></a>
  <a href="games.html" class="active"><span class="slot-num">3</span>&#127918;<span class="slot-label">GAMES</span></a>
  <a href="movies.html"><span class="slot-num">4</span>&#127916;<span class="slot-label">MOVIES</span></a>
  <a href="play.html"><span class="slot-num">5</span>&#9935;<span class="slot-label">PLAY</span></a>
</nav>

</body>
</html>
